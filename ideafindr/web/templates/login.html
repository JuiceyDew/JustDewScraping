{% extends "base.html" %}
{% block title %}log in · ideafindr{% endblock %}
{% block body %}
<h1>ideafindr</h1>
<p class="sub">what people say · what people search</p>

<div class="card" style="max-width:22rem">
  {% if error %}<p class="error">Wrong password.</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Password
      <input name="password" type="password" autofocus required></label>
    <button type="submit">Log in</button>
  </form>
  <p class="meta">Set at the server with <code>AUTH_PASSWORD</code> or
    <code>ideafindr passwd</code>.</p>
</div>
{% endblock %}
